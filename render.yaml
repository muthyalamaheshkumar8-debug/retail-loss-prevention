# Free demo only: no paid services or disks. MongoDB Atlas M0 is configured separately.
services:
  - type: web
    name: retail-review
    runtime: docker
    repo: https://github.com/muthyalamaheshkumar8-debug/retail-loss-prevention
    branch: main
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CV_ENABLED
        value: "false"
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: MAX_DURATION
        value: "120"
      - key: MAX_RESOLUTION_PIXELS
        value: "921600"
      - key: FFMPEG_THREADS
        value: "1"
      - key: DATABASE_NAME
        value: loss_prevention
      - key: MONGODB_URI
        sync: false
